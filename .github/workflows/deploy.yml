name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - trunk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate toolAuth.js
        run: |
          mkdir -p js
          # Get password from secrets (GitHub Actions automatically masks secrets in logs)
          PASSWORD="${{ secrets.TOOL_PASSWORD }}"
          if [ -z "$PASSWORD" ]; then
            echo "Warning: TOOL_PASSWORD secret not set. Using default password for build."
            PASSWORD="changeme"
          fi
          # Escape the password for use in JavaScript string
          # Escape backslashes first, then single quotes, then newlines
          # Note: Password will be in the generated JS file, but not in workflow logs due to secret masking
          ESCAPED_PASSWORD=$(printf '%s' "$PASSWORD" | sed 's/\\/\\\\/g' | sed "s/'/\\\\'/g" | tr -d '\n\r')
          # Generate file - write line by line to avoid heredoc YAML parsing issues
          {
            echo "/**"
            echo " * Tool Authentication Configuration"
            echo " * This file is auto-generated by GitHub Actions during build"
            echo " * Password is injected from GitHub Secrets"
            echo " */"
            echo "const TOOL_PASSWORD = '$ESCAPED_PASSWORD';"
            echo ""
            echo "/**"
            echo " * Check if user is authenticated"
            echo " */"
            echo "function isAuthenticated() {"
            echo "    return sessionStorage.getItem('toolAuthenticated') === 'true';"
            echo "}"
            echo ""
            echo "/**"
            echo " * Authenticate user with password"
            echo " */"
            echo "function authenticate(password) {"
            echo "    if (password === TOOL_PASSWORD) {"
            echo "        sessionStorage.setItem('toolAuthenticated', 'true');"
            echo "        return true;"
            echo "    }"
            echo "    return false;"
            echo "}"
            echo ""
            echo "/**"
            echo " * Logout user"
            echo " */"
            echo "function logout() {"
            echo "    sessionStorage.removeItem('toolAuthenticated');"
            echo "}"
            echo ""
            echo "// Export for use in other modules"
            echo "if (typeof window !== 'undefined') {"
            echo "    window.toolAuth = {"
            echo "        isAuthenticated,"
            echo "        authenticate,"
            echo "        logout,"
            echo "        TOOL_PASSWORD: undefined // Don't expose password"
            echo "    };"
            echo "}"
          } > js/toolAuth.js
          # Verify file was created
          if [ ! -f js/toolAuth.js ]; then
            echo "Error: toolAuth.js was not created!"
            exit 1
          fi
          echo "toolAuth.js generated successfully"
          # Verify the file contains valid JavaScript (check for TOOL_PASSWORD assignment)
          if ! grep -q "const TOOL_PASSWORD" js/toolAuth.js; then
            echo "Error: toolAuth.js is missing TOOL_PASSWORD constant!"
            exit 1
          fi
          # Verify password was replaced (should not contain placeholder)
          if grep -q "PASSWORD_PLACEHOLDER" js/toolAuth.js; then
            echo "Error: Password placeholder was not replaced!"
            exit 1
          fi
          # Verify the password constant is not empty
          if grep -q "const TOOL_PASSWORD = '';" js/toolAuth.js; then
            echo "Error: TOOL_PASSWORD is empty!"
            exit 1
          fi
          # Verify JavaScript syntax using node (capture errors but don't show file contents)
          SYNTAX_CHECK=$(node -c js/toolAuth.js 2>&1)
          SYNTAX_EXIT=$?
          if [ $SYNTAX_EXIT -ne 0 ]; then
            echo "Error: toolAuth.js has invalid JavaScript syntax!"
            echo "Syntax error details (password masked):"
            # Show error but mask any password that might appear in error messages
            echo "$SYNTAX_CHECK" | sed "s/'[^']*'/'***MASKED***'/g" | sed 's/[0-9a-zA-Z]\{8,\}/***MASKED***/g'
            echo "File structure check:"
            wc -l js/toolAuth.js
            head -n 1 js/toolAuth.js | grep -q "/\*\*" && echo "File header present" || echo "File header missing"
            # Check if password line exists and is valid
            grep "const TOOL_PASSWORD" js/toolAuth.js | head -c 50
            echo "... (truncated for security)"
            exit 1
          fi
          # Verify window.toolAuth export exists in the file
          if ! grep -q "window.toolAuth" js/toolAuth.js; then
            echo "Error: toolAuth.js is missing window.toolAuth assignment!"
            exit 1
          fi
          # Verify all required functions are present
          if ! grep -q "function isAuthenticated" js/toolAuth.js || ! grep -q "function authenticate" js/toolAuth.js || ! grep -q "function logout" js/toolAuth.js; then
            echo "Error: toolAuth.js is missing required functions!"
            exit 1
          fi
          echo "JavaScript syntax validation passed"
          echo "File structure verified: all required functions and exports present"
          # List the file to confirm it exists (without showing contents)
          ls -lh js/toolAuth.js
          echo "File size and permissions verified"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
