name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - trunk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate toolAuth.js
        run: |
          mkdir -p js
          PASSWORD="${{ secrets.TOOL_PASSWORD }}"
          if [ -z "$PASSWORD" ]; then
            echo "Warning: TOOL_PASSWORD secret not set. Using default password for build."
            PASSWORD="changeme"
          fi
          cat > js/toolAuth.js << EOF
          /**
           * Tool Authentication Configuration
           * This file is auto-generated by GitHub Actions during build
           * Password is injected from GitHub Secrets
           */
          const TOOL_PASSWORD = '$PASSWORD';

          /**
           * Check if user is authenticated
           */
          function isAuthenticated() {
              return sessionStorage.getItem('toolAuthenticated') === 'true';
          }

          /**
           * Authenticate user with password
           */
          function authenticate(password) {
              if (password === TOOL_PASSWORD) {
                  sessionStorage.setItem('toolAuthenticated', 'true');
                  return true;
              }
              return false;
          }

          /**
           * Logout user
           */
          function logout() {
              sessionStorage.removeItem('toolAuthenticated');
          }

          // Export for use in other modules
          if (typeof window !== 'undefined') {
              window.toolAuth = {
                  isAuthenticated,
                  authenticate,
                  logout,
                  TOOL_PASSWORD: undefined // Don't expose password
              };
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
